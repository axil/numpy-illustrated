name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release
    uses: ./.github/workflows/pytest.yml

  build:
    name: Build and validate distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel and test dependencies
        run: python -m pip install dist/*.whl pytest pandas
      - name: Check package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -I - <<'PY'
          import os
          from importlib.metadata import version
          import npi

          package_version = version("numpy-illustrated")
          if npi.__version__ != package_version:
              raise SystemExit("setup.py and npi.__version__ must match")
          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag.removeprefix("v") != package_version:
              raise SystemExit(f"Release tag {tag!r} does not match package version {package_version!r}")
          print(f"Validated numpy-illustrated {package_version}")
          PY
      - name: Test the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" -W error::DeprecationWarning
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/numpy-illustrated
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
